# Varsayilan shell olarak bash kullan.
set-option -g default-shell "/bin/bash"

# 256 renk ve daha iyi terminal uyumlulugu icin terminal tipini ayarla.
set-option -g default-terminal "tmux-256color"

# xterm-256color kullanan terminallerde RGB/true color destegi ac.
set-option -sa terminal-features ",xterm-256color:RGB"

# Terminal focus/unfocus olaylarini tmux'a ilet.
set-option -g focus-events on

# Esc tusunun bekleme suresi (varsayilan 500 ms). Neovim'de Esc'e basinca gecikme olmasin.
set-option -sg escape-time 10

# Varsayilan prefix olan Ctrl-b bagini kaldir.
unbind C-b

# Yeni prefix tusunu Ctrl-a yap.
set-option -g prefix C-a

# Prefix'e iki kez basinca gercek Ctrl-a karakterini programa gonder.
bind-key -N "Send a literal Ctrl-a to the application" C-a send-prefix

# Prefix + r ile tmux config dosyasini yeniden yukle.
bind -N "Reload ~/.tmux.conf" r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Copy mode icinde vim tuslari kullanilsin.
set-window-option -g mode-keys vi

# Copy mode icinde v ile secim baslat.
bind-key -N "Begin selection" -T copy-mode-vi v send-keys -X begin-selection

# Copy mode icinde Space ile de secim baslat.
bind-key -N "Begin selection" -T copy-mode-vi Space send-keys -X begin-selection

# Copy mode icinde y ile secili metni sistem panosuna kopyala.
bind -N "Copy the selection to the system clipboard" -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'if command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; fi'

# Copy mode icinde Enter ile de secili metni sistem panosuna kopyala.
bind-key -N "Copy the selection to the system clipboard" -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'if command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; fi'

# Mouse ile secim bitince secili metni otomatik olarak sistem panosuna kopyala.
bind-key -N "Copy the mouse selection to the system clipboard" -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'if command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; fi'

# Cift tiklanan kelimeyi dogrudan sistem panosuna kopyala.
bind-key -N "Select the word and copy it to the system clipboard" -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel 'if command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; fi'

# Uc tiklanan satiri dogrudan sistem panosuna kopyala.
bind-key -N "Select the line and copy it to the system clipboard" -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel 'if command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; fi'

# Scrollback history uzun olsun; eski ciktilar kaybolmasin.
set-option -g history-limit 1000000

# Mouse ile pane secme, resize etme ve scroll yapmayi aktif et.
set-option -g mouse on

# Window numaralarini 1'den baslat.
set-option -g base-index 1

# Pane numaralarini 1'den baslat.
set-window-option -g pane-base-index 1

# Bir window kapaninca numaralari otomatik duzenle.
set-option -g renumber-windows on

# Alt durum cubugunun renklerini ayarla.
set-option -g status-style fg=colour12,bg=colour235

# Sol tarafta aktif session adini goster.
set-option -g status-left "#[fg=colour235,bg=colour12][#S]#[fg=default,bg=default] "

# Sol alanin uzunlugunu sinirla.
set-option -g status-left-length 20

# Sag tarafta tarih bilgisini goster.
set-option -g status-right " #[fg=colour235,bg=colour12]%Y-%m-%d-%A"

# Pasif pane cercevesinin gorunumunu ayarla.
set-option -g pane-border-style bg=default

# Aktif pane cercevesini belirginlestir.
set-option -g pane-active-border-style fg=colour12,bg=default

# Arka arkaya basilan prefix komutlarinin tekrar suresini dusur.
set-option -g repeat-time 275

# Prefix + Ctrl-v ile copy mode'a gir.
bind -N "Enter copy mode" C-v copy-mode # [

# Prefix + | ile aktif klasorde saga yeni pane ac.
bind -N "Split right in the current directory" | split-window -h -c "#{pane_current_path}" # %

# Prefix + - ile aktif klasorde alta yeni pane ac.
bind -N "Split below in the current directory" - split-window -v -c "#{pane_current_path}" # "

# Prefix + c ile aktif klasorde yeni window ac.
bind -N "New window in the current directory" c new-window -c "#{pane_current_path}"

# Prefix + h/j/k/l ile paneller arasinda vim gibi gecis yap.
bind -N "Select the pane to the left" h select-pane -L
bind -N "Select the pane below" j select-pane -D
bind -N "Select the pane above" k select-pane -U
bind -N "Select the pane to the right" l select-pane -R

# Prefix + H/J/K/L ile aktif pane'i buyut/kucult.
bind -N "Resize the pane to the left by 5" H resize-pane -L 5
bind -N "Resize the pane down by 5" J resize-pane -D 5
bind -N "Resize the pane up by 5" K resize-pane -U 5
bind -N "Resize the pane to the right by 5" L resize-pane -R 5

# Prefix + e ile synchronize-panes ozelligini ac/kapat.
# Acikken yazdigin komut ayni window'daki tum panellere gider.
bind -N "Toggle synchronize-panes (type into all panes of the window)" e setw synchronize-panes

# Prefix + P ile sistem clipboard'indaki metni aktif pane'e yapistir.
# X11 varsa xclip, Wayland varsa wl-paste kullanilir.
bind -N "Paste the system clipboard" P run-shell "if command -v xclip >/dev/null 2>&1; then tmux set-buffer -- \"$(xclip -o -selection clipboard 2>/dev/null)\" && tmux paste-buffer -p; elif command -v wl-paste >/dev/null 2>&1; then tmux set-buffer -- \"$(wl-paste 2>/dev/null)\" && tmux paste-buffer -p; else tmux display-message 'Clipboard araci bulunamadi'; fi"

# Sag tik ile once sistem clipboard'indaki metni yapistir.
# X11 varsa xclip, Wayland varsa wl-paste kullanilir.
# Sistem clipboard yoksa son tmux buffer'i yapistirilir.
bind-key -N "Right click: paste the system clipboard" -n MouseDown3Pane select-pane -t = \; run-shell "if command -v xclip >/dev/null 2>&1; then tmux set-buffer -- \"$(xclip -o -selection clipboard 2>/dev/null)\" && tmux paste-buffer -p; elif command -v wl-paste >/dev/null 2>&1; then tmux set-buffer -- \"$(wl-paste 2>/dev/null)\" && tmux paste-buffer -p; else tmux paste-buffer -p; fi"

# Oturum kalicligi: tmux-resurrect (Prefix + Ctrl-s kaydet, Prefix + Ctrl-r geri yukle) ve
# tmux-continuum (15 dakikada bir otomatik kaydeder, tmux sunucusu acilinca son kaydi geri yukler).
# Eklentiler install.sh ile ~/.tmux/plugins altina kurulur; yoksa sessizce atlanir.
# continuum, status-right'i degistirir: yukaridaki status ayarlarindan sonra yuklenmeli.
set-option -g @resurrect-capture-pane-contents 'on'
set-option -g @continuum-restore 'on'
if-shell '[ -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux ]' 'run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
if-shell '[ -f ~/.tmux/plugins/tmux-continuum/continuum.tmux ]' 'run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux'

# nvim <-> tmux pane gezintisi (vim-tmux-navigator'in tmux tarafi): Ctrl-h/j/k/l.
# Pane'de vim/nvim (ya da fzf) calisiyorsa tusu ona yollar, degilse tmux pane'ini degistirir.
# NOT: kabukta bu tuslar readline'a gitmez (Ctrl-k satir sonuna kadar siler, Ctrl-l ekrani temizler).
# Gerektiginde Prefix + ayni tus onlari kabuga yollar (asagida).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -N "Go left (nvim split or tmux pane)" -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -N "Go down (nvim split or tmux pane)" -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -N "Go up (nvim split or tmux pane)" -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -N "Go right (nvim split or tmux pane)" -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -N "Select the pane to the left" -T copy-mode-vi C-h select-pane -L
bind-key -N "Select the pane below" -T copy-mode-vi C-j select-pane -D
bind-key -N "Select the pane above" -T copy-mode-vi C-k select-pane -U
bind-key -N "Select the pane to the right" -T copy-mode-vi C-l select-pane -R
bind-key -N "Send Ctrl-h to the application (shell)" C-h send-keys C-h
bind-key -N "Send Ctrl-j to the application (shell)" C-j send-keys C-j
bind-key -N "Send Ctrl-k to the application (shell: kill line)" C-k send-keys C-k
bind-key -N "Send Ctrl-l to the application (shell: clear screen)" C-l send-keys C-l

# Prefix + F1: lc-help (komut ve kisayol arama) popup'ta. install.sh ~/.local/bin/lc-help'i baglar.
bind-key -N "Search commands and keys (lc-help)" F1 display-popup -E -w 85% -h 80% "[ -x ~/.local/bin/lc-help ] && ~/.local/bin/lc-help --popup || { echo 'lc-help is not installed (run ./install.sh)'; read -r _; }"

# Prefix + Tab: ekrandaki metinden (URL, yol, hash, IP, kelime) fzf ile sec, panoya al ya da komut satirina yaz.
# extrakto (laktak) eklentisi, install.sh sabit commit'e kurar; python3 + fzf gerekir. Eklentinin kendi
# tus baglamasini kullanmiyoruz (-N notu lc-help'te gorunsun diye burada bagliyoruz).
bind-key -N "Pick text on screen (URL, path, hash, IP) and copy or type it (extrakto)" Tab if-shell '[ -f ~/.tmux/plugins/extrakto/scripts/open.sh ]' 'run-shell "~/.tmux/plugins/extrakto/scripts/open.sh \"#{pane_id}\""' 'display-message "extrakto is not installed (run ./install.sh)"'

# SIK KULLANILAN TUSLAR
# Prefix + Ctrl-v  : copy mode'a gir
# Prefix + r       : config'i yeniden yukle
# Prefix + |       : saga split ac
# Prefix + -       : alta split ac
# Prefix + c       : ayni klasorde yeni window ac
# Prefix + h/j/k/l : paneller arasinda gecis yap
# Prefix + H/J/K/L : panel boyutunu degistir
# Prefix + e       : ayni komutu tum panellere yazma modunu ac/kapat
# Sag tik          : once sistem clipboard'ini, yoksa tmux buffer'ini yapistir
# Alt + Sag tik    : tmux sag tik menusunu ac
# Prefix + q       : pane numaralarini goster, numaraya basarak sec
# Prefix + p       : onceki window
# Prefix + P       : sistem clipboard'indaki metni yapistir
# Prefix + n       : sonraki window
# Prefix + w       : window listesini ac
# Prefix + d       : tmux'tan ayril, session calismaya devam etsin
# Prefix + x       : aktif pane'i onayla kapat
# Prefix + z       : aktif pane'i buyut/kucult
# Prefix + ,       : aktif window adini degistir
# Prefix + {       : panellerin yerini degistir
# Prefix + Space   : siradaki layout'a gec
#
# COPY MODE
# Prefix + Ctrl-v  : copy mode'a gir
# v veya Space     : secim baslat
# Hareket tuslari  : metin sec
# y veya Enter     : secili metni clipboard'a kopyala
# Mouse ile sec-birak: secili metni otomatik clipboard'a kopyala
#
# FAYDALI TMUX KOMUTLARI
# tmux list-keys                           : tum key binding'leri listele
# tmux ls                                  : acik session'lari goster
# tmux attach -t <session>                 : session'a baglan
# tmux kill-session -t <session>           : session'i kapat
# tmux rename-session -t <eski> <yeni>     : session adini degistir
# tmux new -s <session-name>               : yeni session baslat
#
# KABUK FONKSIYONLARI (bash/.bashrc)
# tm [isim]                                : session'a baglan/olustur (tmux icindeyse gec)
# tmw <session:pencere> [hedef_session]    : baska session'daki pencereyi buraya tasi
# tmj [session:pencere] [hedef]            : pencereyi pane olarak birlestir (parametresiz: secim menusu)
#
# OTURUM KALICILIGI
# Prefix + Ctrl-s                          : oturumlari simdi kaydet (resurrect)
# Prefix + Ctrl-r                          : son kaydi geri yukle
#
# NVIM <-> TMUX GEZINTI
# Ctrl-h/j/k/l                             : sol/alt/ust/sag (nvim split ya da tmux pane, otomatik)
# Prefix + Ctrl-h/j/k/l                    : o tusu kabuga/uygulamaya oldugu gibi yolla (Ctrl-k, Ctrl-l ...)
